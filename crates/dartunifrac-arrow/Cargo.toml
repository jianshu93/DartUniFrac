[package]
name = "dartunifrac-arrow"
description = "Arrow C Data Interface marshaling for DartUniFrac: converts a caller's tree arrays and feature-table stream into dartunifrac-core's types, and streams distances back out as COO batches."
version.workspace = true
edition.workspace = true
# arrow-array 60 declares rust-version = "1.88", so this crate cannot go lower
# than that. Verified by building under 1.88.0, not inferred.
# dartunifrac-core does not depend on Arrow and keeps its own lower floor. The
# workspace's rust-toolchain.toml still pins nightly for the binary's anndists
# dependency, so verifying this needs an explicit override --
# `cargo +1.88.0` or RUSTUP_TOOLCHAIN, since a toolchain file wins over neither.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["unifrac", "arrow", "ffi", "MinHash"]

[dependencies]
# The Arrow C Data Interface. `ffi` is what supplies ffi_stream::{FFI_ArrowArrayStream,
# RecordBatchStreamReader}; it turns on arrow-schema/ffi and arrow-data/ffi in turn.
# 60 is the current release, and the one Qiita's data plane already uses.
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-schema = { version = "60", default-features = false }
# The engine this crate marshals for.
dartunifrac-core = { path = "../dartunifrac-core", version = "0.3.2" }
# Per-sample parallelism for the canonical-order sort. Proven on
# wasm32-unknown-emscripten.
rayon = "1.10"

# Deliberately absent: the `arrow` umbrella crate. These two sub-crates are all
# the C Data Interface needs, and the umbrella additionally pulls compute
# kernels, IPC, CSV and JSON -- none of which this crate uses, all of which
# would be compiled for wasm.
