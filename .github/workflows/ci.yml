name: CI

on:
  push:
  pull_request:

jobs:
  # The library crates only: they need no BLAS/LAPACK and no HDF5, so they run
  # anywhere without system packages. The binary needs both and is left out
  # deliberately, to keep this fast and green rather than fighting system deps.
  #
  # The platform matrix is the point. Sketch values are not guaranteed identical
  # across platforms -- TreeMinHash draws `-ln(u)` per element, and libm is not
  # correctly rounded -- so a single Linux runner would certify a property that
  # only holds on Linux. That is exactly how a fixed-vector test reached main
  # green and then failed on an arm64 Mac.
  test:
    name: library tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14] # x86_64-linux, aarch64-darwin
    env:
      # rust-toolchain.toml pins nightly for the binary's anndists dependency.
      # These crates are required to build on stable, and RUSTUP_TOOLCHAIN takes
      # precedence over the toolchain file.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test -p dartunifrac-core -p dartunifrac-arrow -p dartunifrac-capi --all-targets
      # The C harness on Mach-O: the header, the layouts and the link line there.
      # Linux runs it, under valgrind too, in the capi job below.
      - if: runner.os == 'macOS'
        run: make ctest

  # The C ABI as a C caller sees it: the generated header compiles as C11 with
  # warnings as errors, its struct layouts match the Rust side, the staticlib
  # links, and valgrind finds no leak in the handle paths. Linux only, because
  # that is where valgrind runs; the Rust-side tests above cover macOS.
  capi:
    name: C harness under valgrind
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make ctest leaks
